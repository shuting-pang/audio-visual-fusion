<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img"><title>AUC gains from unimodal baselines to multimodal fusion</title><rect width="100%" height="100%" fill="white"/>
<text x="60" y="55" dominant-baseline="central" text-anchor="start" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#183447">From unimodal to multimodal fusion</text>
<text x="60" y="111" dominant-baseline="central" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#516779">AUC only | Audio + video + text | Existing experiment results</text>
<rect x="60" y="175" width="380" height="290" rx="16" fill="#f4f7fa" stroke="#a6bac8" stroke-width="2"/>
<text x="250" y="219" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#183447">Audio to A/V/T</text>
<text x="250" y="285" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#183447">60.10%  →  60.97%</text>
<text x="250" y="342" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#087f8c">+0.87 pp</text>
<text x="250" y="408" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#516779">AUC gain</text>
<rect x="530" y="175" width="380" height="290" rx="16" fill="#f4f7fa" stroke="#a6bac8" stroke-width="2"/>
<text x="720" y="219" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#183447">Video to A/V/T</text>
<text x="720" y="285" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#183447">59.18%  →  60.97%</text>
<text x="720" y="342" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#087f8c">+1.79 pp</text>
<text x="720" y="408" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#516779">AUC gain</text>
<rect x="1000" y="175" width="380" height="290" rx="16" fill="#f4f7fa" stroke="#a6bac8" stroke-width="2"/>
<text x="1190" y="219" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#183447">Text to A/V/T</text>
<text x="1190" y="285" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#183447">60.16%  →  60.97%</text>
<text x="1190" y="342" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#087f8c">+0.81 pp</text>
<text x="1190" y="408" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#516779">AUC gain</text>
<text x="60" y="517" dominant-baseline="central" text-anchor="start" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#183447">Best unimodal baseline: Text 60.16%  →  Multimodal 60.97% (+0.81 pp)</text>
<text x="60" y="563" dominant-baseline="central" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#516779">pp = percentage points. Source: supplied experiment table; no new training run.</text>
</svg>
